name: MMPatriotsDispatch
options:
  bundleIdPrefix: com.mmpatriots
  deploymentTarget:
    iOS: "16.0"
targets:
  MMPatriotsDispatch:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Dispatch
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: Dispatch requires your precise location during your shift so the dispatcher can see your position.
        NSLocationAlwaysAndWhenInUseUsageDescription: Dispatch shares your location during your shift even when your iPhone is locked or the app is in the background. Check Out stops tracking.
        UIBackgroundModes:
          - location
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mmpatriots.dispatch
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      gatherCoverageData: false
